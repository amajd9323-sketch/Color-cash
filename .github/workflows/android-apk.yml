name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'icon.svg'
      - 'sw.js'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: color-clash-android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Validate inline JavaScript
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1]).filter(script => script.trim());
          if (!scripts.length) throw new Error('No inline application script found');
          for (const script of scripts) new Function(script);
          console.log('Inline JavaScript syntax is valid');
          NODE

      - name: Prepare web app
        run: npm run build:web

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Generate real Color Clash launcher icons
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

          # icon.svg contains the artwork as an embedded JPEG. Extract it first;
          # rendering this SVG directly with librsvg made transparent/blank icons.
          python - <<'PY'
          import base64, re
          from pathlib import Path
          svg = Path("icon.svg").read_text(encoding="utf-8")
          match = re.search(r"data:image/jpeg;base64,([^\\\"]+)", svg)
          if not match:
              raise SystemExit("Color Clash logo image was not found inside icon.svg")
          image = base64.b64decode(match.group(1), validate=True)
          if not image.startswith(b"\\xff\\xd8") or not image.endswith(b"\\xff\\xd9"):
              raise SystemExit("Embedded Color Clash logo is not a valid JPEG")
          Path("color-clash-launcher.jpg").write_bytes(image)
          print(f"Extracted Color Clash logo: {len(image)} bytes")
          PY

          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26

          for item in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $item
            density="$1"
            pixels="$2"
            target="android/app/src/main/res/mipmap-$density"
            mkdir -p "$target"
            convert color-clash-launcher.jpg -resize "${pixels}x${pixels}!" -strip "PNG32:$target/ic_launcher.png"
            convert color-clash-launcher.jpg -resize "${pixels}x${pixels}!" -strip "PNG32:$target/ic_launcher_round.png"
            convert color-clash-launcher.jpg -resize "${pixels}x${pixels}!" -strip "PNG32:$target/ic_launcher_foreground.png"
          done

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/color_clash_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          cat > android/app/src/main/res/values/color_clash_launcher.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="color_clash_launcher_background">#080A1C</color>
          </resources>
          XML

          # Fail the build instead of publishing an APK with blank or missing icons.
          identify android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test "$(stat -c%s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png)" -gt 5000
          test "$(stat -c%s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png)" -gt 5000
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Color-Clash-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
